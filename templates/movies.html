{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4 text-center">Movie Collection</h1>
    
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for movie in movies %}
        <div class="col">
            <div class="card h-100 shadow">
                <img src="{{ movie.poster_url }}" 
                     class="card-img-top" 
                     alt="{{ movie.title }}"
                     style="height: 400px; object-fit: cover;">
                
                <div class="card-body">
                    <h5 class="card-title">{{ movie.title }}</h5>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge bg-primary">{{ movie.rating }}</span>
                        <small class="text-muted">{{ movie.release_year }}</small>
                    </div>
                    
                    <div class="mt-2">
                        {% for genre in movie.genres %}
                        <span class="badge bg-secondary me-1 mb-1">{{ genre }}</span>
                        {% endfor %}
                    </div>
                </div>
                
                <div class="card-footer bg-white border-0">
                    <a href="{{ url_for('web.movie_detail', movie_id=movie.movie_id) }}" 
                       class="btn btn-outline-primary w-100">
                        View Details
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
