{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Top Rated Movies</h1>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for movie in movies %}
        <div class="col">
            <div class="card h-100 shadow">
                <img src="{{ movie.poster_url }}" 
                     class="card-img-top" 
                     alt="{{ movie.title }}"
                     style="height: 400px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title">{{ movie.title }}</h5>
                    <p class="card-text">
                        <span class="badge bg-primary">{{ movie.rating }}</span>
                        <small class="text-muted ms-2">{{ movie.release_year }}</small>
                    </p>
                    <div class="mb-2">
                        {% for genre in movie.genres %}
                        <span class="badge bg-secondary me-1">{{ genre }}</span>
                        {% endfor %}
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <a href="{{ url_for('web.movie_detail', movie_id=movie.movie_id) }}" 
                       class="btn btn-sm btn-outline-primary">
                        Details
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
